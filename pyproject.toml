[project]
name = "parkinsons-voice-classification"
version = "1.0.0"
description = "Leakage-aware Parkinson voice classification at patient level"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
  "joblib>=1.4.0",
  "numpy>=1.26.0",
  "pandas>=2.0.0",
  "scikit-learn>=1.4.0",
]

[project.scripts]
parkinson-audit = "parkinson_voice.cli:audit"
parkinson-evaluate = "parkinson_voice.cli:evaluate"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["parkinson_voice*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-runtime/tmp"
cache_dir = ".pytest-runtime/cache"



[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
