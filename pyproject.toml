[project]
name = "parkinsons-voice-classification"
version = "1.0.0"
description = "Leakage-aware Parkinson voice classification at patient level"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = [
  "joblib>=1.4,<2",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
]

[project.scripts]
parkinson-audit = "src.cli:audit"
parkinson-evaluate = "src.cli:evaluate"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --basetemp=reports/.pytest-tmp"
cache_dir = "reports/.pytest-cache"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
